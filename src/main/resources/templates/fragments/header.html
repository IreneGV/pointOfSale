<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title th:text="${pageTitle}">Miscelánea Casa Krystal</title>
<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
</head>
<body>
	<header>
		<nav class="navbar bg-body-tertiary fixed-top">
			<div class="container-fluid">
				<img th:src="@{/img/Logo.ico}" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
				<a class="navbar-brand" href="#">Miscelánea Casa Krystal</a>
				<form class="d-flex mt-3" role="search">
					<input class="form-control me-2" type="search" placeholder="Buscar"
						aria-label="Search">
					<button class="btn btn-outline-success" type="submit">Buscar</button>
				</form>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
					aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="offcanvas offcanvas-end" tabindex="-1"
					id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
					<div class="offcanvas-header">
						<h5 class="offcanvas-title" id="offcanvasNavbarLabel">Operaciones</h5>
						<button type="button" class="btn-close"
							data-bs-dismiss="offcanvas" aria-label="Close"></button>
					</div>
					<div class="offcanvas-body">
						<ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
							<li class="nav-item"><a class="nav-link active"
								aria-current="page" th:href="@{/categorias}">Categorias</a></li>
							<li class="nav-item"><a class="nav-link active"
								aria-current="page" th:href="@{/unidadesmedidas}">Unidades de medida</a></li>
							<li class="nav-item"><a class="nav-link active"
								aria-current="page" th:href="@{/proveedores}">Proveedores</a></li>
							<li class="nav-item"><a class="nav-link active"
								aria-current="page" th:href="@{/productos}">Productos</a></li>
							<li class="nav-item dropdown"><a
								class="nav-link dropdown-toggle" href="#" role="button"
								data-bs-toggle="dropdown" aria-expanded="false"> Productos </a>
								<ul class="dropdown-menu">
									<li><a class="dropdown-item" href="#">Inventario</a></li>
								</ul></li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
